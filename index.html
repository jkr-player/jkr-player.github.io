<meta name="theme-color" content="#0a0c11">
<link rel="icon" href="logo.png">
<style>
  :root { --bg: #0a0c11; --card: #14171e; --line: #252933; --text: #eceef2; --muted: #a2a8b4; --cream: #f2e8d1; --gold: #d9b873; --grad: linear-gradient(135deg, #f6e3b0, #d9b873 55%, #b08a42); }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 76px; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; overflow-x: hidden; }
  img { max-width: 100%; height: auto; display: block; }
  a { color: var(--cream); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
  .gold { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  nav { position: sticky; top: 0; z-index: 10; background: rgba(10, 12, 17, .82); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  nav .wrap { display: flex; align-items: center; gap: 22px; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-weight: 700; letter-spacing: .3px; white-space: nowrap; }
  .brand img { width: 38px; height: 38px; }
  .brand small { display: block; font-weight: 500; font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); margin-top: -4px; }
  .links { display: flex; gap: 20px; margin-left: auto; }
  .links a { color: var(--muted); text-decoration: none; font-size: 15px; }
  .links a:hover { color: var(--cream); }
  .langs { display: flex; gap: 4px; }
  .langs button { background: none; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .langs button[aria-pressed="true"] { color: var(--bg); background: var(--cream); border-color: var(--cream); }

  .hero { position: relative; padding: 70px 0 40px; }
  .hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; filter: blur(110px); z-index: -1; }
  .hero::before { width: 520px; height: 520px; background: rgba(217, 184, 115, .20); top: -160px; right: -120px; }
  .hero::after { width: 420px; height: 420px; background: rgba(70, 110, 200, .14); bottom: -120px; left: -160px; }
  .hero .wrap > *, .split > * { min-width: 0; }
  .hero .wrap { display: grid; grid-template-columns: 1fr 1.1fr; gap: 48px; align-items: center; }
  .tag { display: inline-block; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--cream); border-radius: 999px; padding: 5px 14px; font-size: 13px; font-weight: 600; letter-spacing: .3px; }
  h1 { font-size: clamp(38px, 5.4vw, 64px); line-height: 1.05; letter-spacing: -1.5px; margin: 18px 0 18px; }
  .lead { color: var(--muted); font-size: 19px; max-width: 520px; margin: 0 0 28px; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .btn { display: inline-block; background: var(--grad); color: #17130a; text-decoration: none; font-weight: 700; padding: 13px 26px; border-radius: 999px; font-size: 16px; }
  .btn.ghost { background: none; color: var(--cream); border: 1px solid var(--line); }
  .btn.small { padding: 8px 16px; font-size: 15px; margin-top: 10px; }
  .fine { color: var(--muted); font-size: 14px; margin: 16px 0 0; }

  .stage { position: relative; padding-bottom: 26px; }
  .tv { border: 10px solid #1b1e26; border-radius: 16px; box-shadow: 0 40px 90px rgba(0, 0, 0, .6), 0 0 0 1px #2c313c; overflow: hidden; background: #000; }
  .tv img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
  .foot { width: 34%; height: 10px; margin: 0 auto; background: #1b1e26; border-radius: 0 0 10px 10px; }
  .phone { border: 7px solid #1b1e26; border-radius: 26px; overflow: hidden; background: #000; box-shadow: 0 30px 70px rgba(0, 0, 0, .65), 0 0 0 1px #2c313c; }
  .stage .phone { position: absolute; width: 24%; right: -2%; bottom: 0; }

  .devices { padding: 26px 0 10px; text-align: center; }
  .devices p { color: var(--muted); font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase; margin: 0 0 14px; }
  .pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .pills span { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 18px; font-weight: 600; font-size: 15px; color: var(--cream); }

  section.wrap { padding-top: 84px; }
  .kicker { color: var(--gold); font-size: 13px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; margin: 0 0 8px; }
  h2 { font-size: clamp(28px, 3.6vw, 42px); line-height: 1.12; letter-spacing: -.8px; margin: 0 0 14px; }
  .center { text-align: center; }
  .center .sub { margin-left: auto; margin-right: auto; }
  .sub { color: var(--muted); max-width: 620px; margin: 0 0 30px; }

  .split { display: grid; grid-template-columns: 1fr 1.15fr; gap: 54px; align-items: center; }
  .split.flip > .pic { order: -1; }
  .split p.txt { color: var(--muted); font-size: 18px; margin: 0; }
  .pic { position: relative; }
  .pic .phone { position: absolute; width: 26%; right: 4%; bottom: -8%; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .card h3 { margin: 0 0 6px; font-size: 19px; }
  .card .who { color: var(--muted); font-size: 15px; margin: 0 0 10px; }
  .card ol { margin: 0; padding-left: 20px; }
  .card li { margin: 4px 0; }
  .ico { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: rgba(217, 184, 115, .12); border: 1px solid rgba(217, 184, 115, .25); font-size: 19px; margin-bottom: 12px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
  .ok { background: #1f3a2a; color: #8fd6a6; }
  .soon { background: #3a321f; color: var(--gold); }
  .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 22px; font-weight: 700; color: var(--cream); letter-spacing: 2px; }

  .price { max-width: 720px; margin: 0 auto; background: linear-gradient(180deg, rgba(217, 184, 115, .10), rgba(217, 184, 115, .02)); border: 1px solid rgba(217, 184, 115, .35); border-radius: 24px; padding: 36px 28px; text-align: center; }
  .price .big { font-size: clamp(64px, 10vw, 104px); font-weight: 800; line-height: 1; letter-spacing: -3px; margin: 6px 0 4px; }
  .price .unit { color: var(--muted); margin: 0 0 20px; }
  .ticks { list-style: none; padding: 0; margin: 0 0 24px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .ticks li { border: 1px solid var(--line); background: rgba(0, 0, 0, .25); border-radius: 999px; padding: 7px 16px; font-weight: 600; font-size: 15px; }
  .ticks li::before { content: "✓ "; color: var(--gold); }

  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; counter-reset: s; }
  .steps .card { counter-increment: s; }
  .steps .card::before { content: counter(s); display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--grad); color: #17130a; font-weight: 800; margin-bottom: 12px; }
  .steps p { margin: 0; }

  .faq { max-width: 820px; margin: 0 auto; }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; margin: 10px 0; }
  summary { cursor: pointer; font-weight: 600; }
  details p { color: var(--muted); margin: 8px 0 2px; }
  .note { max-width: 820px; margin: 48px auto 0; border-left: 3px solid var(--gold); padding: 6px 14px; color: var(--muted); font-size: 15px; }
  footer { margin-top: 48px; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); padding: 22px 0 40px; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
  footer .brand { margin-right: auto; }

  .rv { opacity: 0; transform: translateY(22px); transition: opacity .6s ease, transform .6s ease; }
  .rv.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .rv { opacity: 1; transform: none; transition: none; } html { scroll-behavior: auto; } }

  @media (max-width: 860px) {
    .links { display: none; }
    .langs { margin-left: auto; }
    .hero { padding-top: 40px; }
    .hero .wrap, .split { grid-template-columns: 1fr; gap: 30px; }
    .split.flip > .pic { order: 0; }
    .steps { grid-template-columns: 1fr; }
    section.wrap { padding-top: 60px; }
    .pic .phone { bottom: -5%; }
  }
  @media (max-width: 420px) { .brand small { display: none; } .langs button { padding: 5px 7px; } }
</style>
</head>

function setLang(l) {
  if (!T[l]) l = "de";
  document.documentElement.lang = l;
  document.querySelectorAll("[data-k]").forEach(e => { e.textContent = T[l][e.dataset.k] || ""; });

  try { localStorage.setItem("jkr.lang", l); } catch (e) {}
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

// Sections fade in as they scroll into view.
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .08 });
  document.querySelectorAll(".rv").forEach(e => io.observe(e));
} else document.querySelectorAll(".rv").forEach(e => e.classList.add("in"));
